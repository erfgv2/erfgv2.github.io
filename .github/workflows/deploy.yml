name: Deploy static site to Pages

# The site is built LOCALLY (`hugo --minify --gc --cleanDestinationDir`)
# and the generated `public/` directory is committed to this repository.
# This workflow does NOT run Hugo - it only publishes what is already
# committed under `public/`.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build output is committed
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html not found."
            echo "::error::Run the local build before pushing: hugo --minify --gc --cleanDestinationDir"
            exit 1
          fi
          echo "Found $(find public -type f | wc -l) files in public/"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
